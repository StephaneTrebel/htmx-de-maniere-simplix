[tools]
go = "1.24"
node = "24"

[tools."go:github.com/a-h/templ/cmd/templ"]
version = "latest"

[tasks.trunk]
description = "Retourne sur la branch trunk"
run = "git checkout trunk"

[tasks.slides]
description = "Lance la presentation slidesk"
depends = ["trunk"]
run = "slidesk"
dir = "presentation"

[tasks."go:dev"]
description = "Lance le backend Go en mode watch (templ + go run)"
run = "make dev"
dir = "go-hda-backend"

[tasks.spa]
description = "Lance la SPA Preact en mode dev sur :8080"
run = "npm run start"
dir = "preact-realworld-example-app"

[tasks.stack]
description = "Lance la stack complète (Traefik + Go HDA + SPA) via Docker Compose"
run = "docker compose up"
dir = "reverse-proxy"

[tasks.down]
description = "Arrête la stack Docker Compose"
run = "docker compose down"
dir = "reverse-proxy"

[tasks.templ]
description = "Régénère les *_templ.go depuis les fichiers .templ"
run = "make templ"
dir = "go-hda-backend"

[tasks.build]
description = "Compile et vérifie le backend Go"
run = "go build ./... && go vet ./..."
dir = "go-hda-backend"

[tasks.check]
description = "Validation complète avant de terminer un step (build + templ + contrôle presentation/)"
depends = ["build", "templ"]
run = """
git diff --name-only trunk...HEAD | grep '^presentation/' \
  && echo 'ERREUR : des fichiers de presentation/ sont dans le diff du step' && exit 1 \
  || echo 'OK : presentation/ non modifiée'
"""

[tasks.step]
description = "Change de branche (ex: mise run step 1)"
usage = '''
arg "<step>" help="Step to run" {
  choices "0" "1" "2" "3" "4" "5"
}
'''
run = """
case "${usage_step}" in
  0) git checkout step-00-spa-json ;;
  1) git checkout step-01-go-hda-proxy ;;
  2) git checkout step-02-article-feed ;;
  3) git checkout step-03-profile ;;
  4) git checkout step-04-comments ;;
  5) git checkout step-05-webcomponent ;;
esac
"""

