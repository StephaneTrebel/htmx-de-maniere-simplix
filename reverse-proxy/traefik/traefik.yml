# Configuration statique Traefik
# Ce fichier est monté dans le container Traefik en lecture seule.

api:
  dashboard: true
  insecure: true   # Dashboard accessible sur :8080 en dev

entryPoints:
  app:
    address: ":1337"

providers:
  docker:
    exposedByDefault: false
    network: conduit-net

log:
  level: INFO

# Plugin local : traffic capture middleware
# Le code source est monté depuis ./traffic-dashboard/plugin/
experimental:
  localPlugins:
    trafficcapture:
      moduleName: github.com/htmx-de-maniere-simplix/trafficcapture
